plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    signingConfigs {
        release {
        }
        debug {
        }
    }
    compileSdk 32

    defaultConfig {
        applicationId "com.ciptakerjaarunika.kerjaloka"
        minSdk 23
        targetSdk 32
        versionCode 7
        versionName "1.0.0.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.debug
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        create("customDebugType") {
            debuggable = true
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    buildFeatures {
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}
apply plugin: 'com.google.gms.google-services'

dependencies {
    implementation 'me.relex:circleindicator:2.1.6'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.3.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.3.5'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.google.android.gms:play-services-location:20.0.0'
    implementation 'com.google.firebase:firebase-auth:21.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'com.google.code.gson:gson:2.9.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation "androidx.percentlayout:percentlayout:1.0.0"
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.2'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation "androidx.fragment:fragment-ktx:1.2.5"

    def emojiVersion = "1.2.0"
    implementation "androidx.emoji2:emoji2:$emojiVersion"
    implementation "androidx.emoji2:emoji2-views:$emojiVersion"
    implementation "androidx.emoji2:emoji2-bundled:$emojiVersion"
    implementation "com.github.andrefrsousa:SuperBottomSheet:2.0.0"
    implementation "com.wdullaer:materialdatetimepicker:4.2.3"
    implementation "com.github.AnyChart:AnyChart-Android:1.1.2"
    implementation 'com.github.andrefrsousa:SuperBottomSheet:2.0.0'
//    retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
//    okhttp
    implementation "com.squareup.okhttp3:okhttp:4.9.2"
    implementation "com.squareup.okhttp3:mockwebserver:3.12.1"

    implementation "com.google.android.material:material:1.7.0"

    implementation "org.ocpsoft.prettytime:prettytime:4.0.4.Final"

    implementation "com.microsoft.signalr:signalr:3.0.0-preview4-19216-03"
    //noinspection GradleCompatible
    implementation 'com.android.support:percent:23.3.0'
    implementation 'org.slf4j:slf4j-jdk14:1.7.25'

    implementation "com.google.android.material:material:1.8.0-alpha02"
    implementation platform('com.google.firebase:firebase-bom:30.3.2')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-messaging:20.1.0'

    // expendable layout
    implementation "com.github.skydoves:expandablelayout:1.0.7"

    //Camera
    implementation "com.github.qingmei2:rximagepicker:2.5.6"
    //noinspection GradleCompatible
    implementation 'com.android.support:percent:23.3.0'
    implementation('org.jitsi.react:jitsi-meet-sdk:6.0.0') { transitive = true }

    implementation 'com.beust:klaxon:5.5'

    //noinspection GradleCompatible
    implementation 'com.android.support:appcompat-v7:27.1.1'

    //google dev
    implementation 'androidx.work:work-runtime-ktx:2.8.0-alpha01'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.android.gms:play-services-auth:20.3.0'

    //firebase analytics
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // librepdf
    implementation 'com.github.librepdf:openpdf:1.3.8'
    implementation 'com.github.andob:android-awt:1.0.0'

    // Import the BoM for the Firebase platform
    implementation platform('com.google.firebase:firebase-bom:31.1.1')
    // Add the dependency for the Performance Monitoring library
    implementation 'com.google.firebase:firebase-perf-ktx:20.3.0'
    //Instabug Dependency
    implementation 'com.instabug.library:instabug:11.7.0'
    implementation "com.instabug.library:instabug-apm:11.7.0"
}

